[build]
  base = "frontend"
  command = "npm install && chmod +x node_modules/.bin/react-scripts && CI= npm run build"
  publish = "build"

[[redirects]]
  from = "/api/*"
  to = "https://breatheesg-assignment-two0.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200